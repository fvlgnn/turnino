{{define "admin-login.html"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Administration · Turnino</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="panel narrow">
      <a class="brand" href="/">Turnino</a>
      <h1 class="page-title">Administration</h1>
      {{if .Error}}<p class="alert error">{{.Error}}</p>{{end}}
      {{if .AdminConfigured}}
      <form method="post" action="/admin/login" class="stack">
        <label>Administrator token
          <input type="password" name="token" required autofocus autocomplete="current-password">
        </label>
        <button type="submit">Sign in</button>
      </form>
      {{else}}
      <p class="alert">Administration is not configured. Set <code>TURNINO_ADMIN_TOKEN</code> and restart Turnino once.</p>
      {{end}}
    </main>
  </body>
</html>
{{end}}
